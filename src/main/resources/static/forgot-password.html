<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password // Gaming Lounge System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email to receive a reset code</p>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <button onclick="handleForgotPassword()">Send Reset Code</button>
        <div class="switch-line"><a href="index.html">Back to login</a></div>
    </div>
</div>
<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/auth/forgot-password.js"></script>
</body>
</html>
