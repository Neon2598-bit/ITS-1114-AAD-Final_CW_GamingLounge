<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email // Gaming Lounge System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="card">
        <h1>Verify Your Email</h1>
        <p class="subtitle" id="subtitleText">We sent a 6-digit code to your email.</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <div class="field">
            <label for="otpCode">Verification Code</label>
            <input type="text" id="otpCode" placeholder="123456" maxlength="6">
        </div>

        <button onclick="handleVerify()">Verify</button>
        <button class="secondary" style="margin-top:10px" onclick="handleResend()">Resend Code</button>

        <div class="switch-line">
            <a href="index.html">Back to login</a>
        </div>
    </div>
</div>

<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/auth/otp.js"></script>
</body>
</html>
