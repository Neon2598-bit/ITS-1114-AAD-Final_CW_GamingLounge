<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register // Gaming Lounge System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="card">
        <h1>Create Account</h1>
        <p class="subtitle">Register to start booking gaming stations</p>

        <div class="error-msg" id="errorMsg"></div>

        <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Kasun Perera">
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="0771234567">
        </div>
        <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Panadura">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••">
        </div>

        <button onclick="handleRegister()">Create Account</button>

        <div class="switch-line">
            Already have an account? <a href="index.html">Sign in</a>
        </div>
    </div>
</div>

<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/auth/register.js"></script>
</body>
</html>
