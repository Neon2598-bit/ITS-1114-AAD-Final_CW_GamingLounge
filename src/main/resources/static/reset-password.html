<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password // Gaming Lounge System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="card">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter the code sent to your email and your new password</p>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <div class="field">
            <label for="otpCode">Reset Code</label>
            <input type="text" id="otpCode" placeholder="123456" maxlength="6">
        </div>
        <div class="field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••">
        </div>
        <button onclick="handleResetPassword()">Reset Password</button>
        <div class="switch-line"><a href="index.html">Back to login</a></div>
    </div>
</div>
<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/auth/forgot-password.js"></script>
</body>
</html>
