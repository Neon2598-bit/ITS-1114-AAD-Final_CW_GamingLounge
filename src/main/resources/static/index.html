<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login // Gaming Lounge System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="card">
        <h1>Gaming Lounge</h1>
        <p class="subtitle">Sign in to your account</p>

        <div class="error-msg" id="errorMsg"></div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="handleLogin()">Sign In</button>
        <button class="secondary" style="margin-top:10px" onclick="handleGuestLogin()">Continue as Guest</button>

        <div class="switch-line">
            No account? <a href="register.html">Register here</a>
        </div>
    </div>
</div>

<script src="lib/jquery-4.0.0.min.js"></script>
<script src="js/auth/login.js"></script>
</body>
</html>
